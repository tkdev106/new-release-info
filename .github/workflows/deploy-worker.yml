name: deploy-worker

# main に入った server/ の変更だけを本番の Worker に出す。アプリだけの変更で出し直さないよう paths で絞る
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  # PR ではデプロイせず、secrets でログインできることと Worker が組み上がることだけを確かめる
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# 続けてマージしたときに古いほうが後から上書きしないよう、本番へは順番に 1 本ずつ流す
concurrency:
  group: deploy-worker-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: secrets の確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::リポジトリの secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください（server/README.md）"
            exit 1
          fi
      - name: ログインと組み上げの確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 deploy --dry-run --outdir dist
      # GEMINI_API_KEY・APP_TOKEN は Worker 側の secret のまま。wrangler deploy は secret に触れない
      - name: デプロイ
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
