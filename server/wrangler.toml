name = "new-releases-suggest"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# アプリを出し直さずに差し替えられるよう、LLM とモデルはここで決める（実装は src/llm/）
LLM_PROVIDER = "gemini"
# 新しく作った無料のキーでは 2.5 系が 404 になり、3.8-flash も通らなかった（2026-11 時点）
GEMINI_MODEL = "gemini-3.5-flash-lite"
# 全利用者を合わせた 1 日（UTC）の LLM 呼び出しの上限。キャッシュから返したものは数えない。
# Gemini の無料枠の 1 日の回数より少し下に置き、枠が尽きて全員が使えなくなるのを防ぐ
DAILY_LLM_LIMIT = "500"
# Play Integrity で確かめるアプリ（PLAY_INTEGRITY_SA_KEY を secret に入れたときだけ使う）
PLAY_PACKAGE_NAME = "app.otoshirase"

# 連打の防止。1 IP あたり 10 秒に 2 回まで（Cloudflare の窓は 10 秒か 60 秒しか選べない）
[[ratelimits]]
name = "BURST_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 10 }

# 1 IP あたり 1 分に 10 回まで。URL とトークンが漏れても無料枠を食い尽くされにくくする
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 1 日の回数を全体で 1 つ数えるための Durable Object（src/guard/quota.js）。無料プランでも使える SQLite 版
[[durable_objects.bindings]]
name = "DAILY_QUOTA"
class_name = "DailyQuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyQuotaCounter"]

# Workers Logs。src/log/logger.js が出す JSON のフィールド（outcome・status・duration_ms など）で検索・集計できる。
# 呼び出しが少ないので全件を残す（無料プランは 1 日 20 万件・3 日保存まで。1 回の呼び出しで 1〜3 件）
[observability]
enabled = true
head_sampling_rate = 1

# Cloudflare が自動で付ける呼び出しのログ（URL・IP 由来の情報を含む）は使わず、自前の request ログに絞る
[observability.logs]
enabled = true
invocation_logs = false
